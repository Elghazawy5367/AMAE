# ================================================================ 
# AMAE — AEO Blog Auto-Deploy (GitHub Pages) 
# Triggered on push to main when docs/ changes 
# Deploys AEO blog articles to GitHub Pages 
# ================================================================ 
 
name: Deploy AEO Blog 
 
on: 
  push: 
    branches: [main] 
    paths: 
      - 'docs/**' 
      - 'campaigns/**/text/aeo-article-cluster.md' 
  workflow_dispatch: 
 
permissions: 
  contents: write 
  pages: write 
  id-token: write 
 
concurrency: 
  group: pages 
  cancel-in-progress: false 
 
jobs: 
  build-and-deploy: 
    name: Build and Deploy Blog 
    runs-on: ubuntu-latest 
    timeout-minutes: 15 
 
    environment: 
      name: github-pages 
      url: ${{ steps.deployment.outputs.page_url }} 
 
    steps: 
      - name: Checkout repository 
        uses: actions/checkout@v4 
        with: 
          fetch-depth: 0  # Full history for last-modified dates 
 
      - name: Set up Node.js 20 
        uses: actions/setup-node@v4 
        with: 
          node-version: '20' 
          cache: 'npm' 
 
      - name: Install dependencies 
        run: npm ci --prefer-offline 
 
      - name: Copy latest AEO articles to docs/blog 
        run: node lib/blog-deployer.js 
        env: 
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }} 
 
      - name: Inject AEO schema and FAQ JSON-LD 
        run: node agents/aeo-optimizer.js --mode=blog 
        env: 
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }} 
 
      - name: Setup Pages 
        uses: actions/configure-pages@v4 
 
      - name: Upload Pages artifact 
        uses: actions/upload-pages-artifact@v3 
        with: 
          path: docs/ 
 
      - name: Deploy to GitHub Pages 
        id: deployment 
        uses: actions/deploy-pages@v4 
``` 
 
